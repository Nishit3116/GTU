name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gtu_academic_engine/requirements.txt
          pip install pytest pylint flake8
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true
      - name: Run linting
        run: |
          python -m pylint gtu_academic_engine --exit-zero || true
          python -m flake8 gtu_academic_engine --exit-zero || true
      - name: Compile check
        run: |
          python -m compileall gtu_academic_engine || true
