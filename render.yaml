services:
  - type: web
    name: gtu-academic-engine
    env: python
    plan: free
    region: singapore

    buildCommand: |
      pip install --upgrade pip
      pip install -e .
      playwright install chromium

    startCommand: python -m gtu_academic_engine

    healthCheckPath: /health

    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: GTU_LOG_LEVEL
        value: INFO
